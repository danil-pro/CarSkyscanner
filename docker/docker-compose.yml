services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: carsky
      POSTGRES_PASSWORD: carsky
      POSTGRES_DB: carsky
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carsky"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Host port 5433 to avoid clashing with a local Postgres on 5432.
      # The backend reaches the DB over the internal network (postgres:5432).
      - "5433:5432"
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg2://carsky:carsky@postgres:5432/carsky
      AUTO_SEED: "true"
      ENABLED_SOURCES: "olx,otomoto,facebook"
      FB_STORAGE_STATE_PATH: "/app/secrets/fb_storage_state.json"
      SEARCH_PROVIDER_TIMEOUT_S: "45"
      SEARCH_JOB_TIMEOUT_S: "60"
    volumes:
      # FB session (storage_state.json) captured on host via scripts/fb_login.py
      - ../backend/secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # Baked into the client bundle. Set NEXT_PUBLIC_API_URL in the root .env
        # to the PUBLIC API address (http://<vps-ip>:8000 or your domain).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # Server Components (SSR) run inside this container, where localhost:8000
      # is NOT the backend. Use the internal compose hostname instead.
      API_URL_INTERNAL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
